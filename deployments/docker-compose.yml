services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: procure
      POSTGRES_PASSWORD: procure
      POSTGRES_DB: procure
    ports:
      # Host port 55432 avoids clashing with a locally installed PostgreSQL.
      - "55432:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
      - procure-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure -d procure"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: procure-flow:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      CORS_ALLOWED_ORIGINS: ""
      # Local compose keeps the interactive reference enabled for testing.
      DOCS_ENABLED: "true"
      DATABASE_URL: "postgres://procure:procure@db:5432/procure?sslmode=disable"
      DB_AUTO_MIGRATE: "true"
      AUTH_ENABLED: "true"
      # Local-only credentials. Replace these before exposing the stack.
      AUTH_API_KEYS: '[{"token":"local-admin-token-0123456789","subject":"user_admin","name":"Local Admin","roles":["admin"]},{"token":"local-approver-token-0123456789","subject":"user_fin","name":"Finance Approver","roles":["approver"],"department":"Engineering"}]'
      IDEMPOTENCY_ENABLED: "true"
      IDEMPOTENCY_TTL: "24h"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_STORE: redis
      RATE_LIMIT_RPS: "20"
      RATE_LIMIT_BURST: "40"
      METRICS_ENABLED: "true"
      # Shared state across replicas, plus a read-through aggregate cache.
      REDIS_URL: "redis://redis:6379/0"
      CACHE_ENABLED: "true"
      CACHE_TTL: "30s"
      # Lifecycle events are written to the transactional outbox and relayed
      # to this exchange; the worker drains it.
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: "procure.events"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: procure-flow:local
    entrypoint: ["/worker"]
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: "procure.events"
      # Optional outbound webhooks. Empty simulates delivery with a log line.
      NOTIFICATION_WEBHOOK_URL: ""
      ERP_WEBHOOK_URL: ""
    depends_on:
      rabbitmq:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  procure-db:
