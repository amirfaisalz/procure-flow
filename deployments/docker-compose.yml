services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: procure
      POSTGRES_PASSWORD: procure
      POSTGRES_DB: procure
    ports:
      # Host port 55432 avoids clashing with a locally installed PostgreSQL.
      - "55432:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
      - procure-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure -d procure"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: procure-flow:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      CORS_ALLOWED_ORIGINS: ""
      # Local compose keeps the interactive reference enabled for testing.
      DOCS_ENABLED: "true"
      DATABASE_URL: "postgres://procure:procure@db:5432/procure?sslmode=disable"
      DB_AUTO_MIGRATE: "true"
      AUTH_ENABLED: "true"
      # Local-only credentials. Replace these before exposing the stack.
      AUTH_API_KEYS: '[{"token":"local-admin-token-0123456789","subject":"user_admin","name":"Local Admin","roles":["admin"]},{"token":"local-approver-token-0123456789","subject":"user_fin","name":"Finance Approver","roles":["approver"],"department":"Engineering"}]'
      IDEMPOTENCY_ENABLED: "true"
      IDEMPOTENCY_TTL: "24h"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_RPS: "20"
      RATE_LIMIT_BURST: "40"
      METRICS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  procure-db:
