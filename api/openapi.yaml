openapi: 3.1.0
info:
  title: procure-flow API
  version: 1.0.0
  description: |
    Procurement workflow API. Success responses use `{"data": ..., "meta": ...}`.
    Errors use RFC 9457 `application/problem+json`.

    Write endpoints accept an `Idempotency-Key` header: retrying with the same
    key and body replays the original response instead of creating a duplicate.
    API routes are rate limited per caller and return `429` with `Retry-After`
    when the bucket is exhausted.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Procurements
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Liveness"
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: All dependencies are usable
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Readiness"
  /api/v1/procurements:
    get:
      tags: [Procurements]
      summary: List procurements
      operationId: listProcurements
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: q
          in: query
          description: Case-insensitive search across number, title, description, department, and requester.
          schema: { type: string }
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: A page of procurements
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Procurement"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      tags: [Procurements]
      summary: Create a draft procurement
      operationId: createProcurement
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Client-generated key (1-255 printable ASCII characters). Repeating
            the request with the same key and body replays the stored response;
            reusing the key with a different body returns `422`.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcurementRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "201":
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the created procurement
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Procurement"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          description: A request with this Idempotency-Key is still in progress
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/procurements/{id}:
    get:
      tags: [Procurements]
      summary: Get a procurement
      operationId: getProcurement
      parameters:
        - $ref: "#/components/parameters/ProcurementID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Procurement
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Procurement"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/procurements/{id}/submit:
    post:
      tags: [Procurements]
      summary: Submit a draft procurement
      operationId: submitProcurement
      parameters:
        - $ref: "#/components/parameters/ProcurementID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          $ref: "#/components/responses/Procurement"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/procurements/{id}/approve:
    post:
      tags: [Procurements]
      summary: Approve a submitted procurement
      operationId: approveProcurement
      parameters:
        - $ref: "#/components/parameters/ProcurementID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          $ref: "#/components/responses/Procurement"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/procurements/{id}/reject:
    post:
      tags: [Procurements]
      summary: Reject a submitted procurement
      operationId: rejectProcurement
      parameters:
        - $ref: "#/components/parameters/ProcurementID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          $ref: "#/components/responses/Procurement"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/procurements/{id}/cancel:
    post:
      tags: [Procurements]
      summary: Cancel a draft or submitted procurement
      operationId: cancelProcurement
      parameters:
        - $ref: "#/components/parameters/ProcurementID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          $ref: "#/components/responses/Procurement"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/procurements/{id}/audit:
    get:
      tags: [Procurements]
      summary: Read the procurement audit trail
      description: Returns append-only lifecycle events, newest first.
      operationId: listProcurementAudit
      parameters:
        - $ref: "#/components/parameters/ProcurementID"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "404":
          $ref: "#/components/responses/Problem"
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition format. This endpoint is public, like the
        health probes; restrict it at the network layer in production.
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or JWT
      description: |
        Send either a static API key or an HS256 JWT as `Authorization: Bearer <token>`.
        API keys are configured with `AUTH_API_KEYS`; JWTs are verified with
        `AUTH_JWT_SECRET`, `AUTH_JWT_ISSUER`, and `AUTH_JWT_AUDIENCE`.
  parameters:
    ProcurementID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^prc_[a-f0-9]{32}$"
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller is not allowed to perform this action
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The caller exceeded the rate limit
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Procurement:
      description: Updated procurement
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/Procurement"
    Problem:
      description: RFC 9457 problem document
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Status:
      type: string
      enum: [draft, submitted, approved, rejected, cancelled]
    CreateProcurementRequest:
      type: object
      additionalProperties: false
      required: [title, department, amount, currency]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        department:
          type: string
          minLength: 1
          maxLength: 100
        requester:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional display name; defaults to the authenticated actor.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in the minor unit of the currency.
        currency:
          type: string
          pattern: "^[A-Za-z]{3}$"
          description: ISO 4217 code.
    Procurement:
      type: object
      required:
        [id, number, title, department, requester, amount, currency, status, created_at, updated_at, version]
      properties:
        id:
          type: string
          example: prc_4655b358bf93a50be264cace48feefeb
        number:
          type: string
          pattern: "^PR-[0-9]{6}-[A-F0-9]{16}$"
          example: PR-202610-BD08EF2B4C6A1D9F
        title:
          type: string
        description:
          type: string
        department:
          type: string
        requester:
          type: string
        requester_id:
          type: string
          readOnly: true
          description: Authenticated subject that created the request.
        amount:
          type: integer
          format: int64
        currency:
          type: string
          example: IDR
        status:
          $ref: "#/components/schemas/Status"
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    AuditEvent:
      type: object
      required: [id, action, actor_id, actor_name, actor_role, occurred_at]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
          example: procurement.approved
        actor_id:
          type: string
        actor_name:
          type: string
        actor_role:
          type: string
          enum: [admin, approver, requester, viewer, ""]
        from_status:
          type: string
        to_status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        occurred_at:
          type: string
          format: date-time
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    Liveness:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, error]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: VALIDATION_ERROR
        request_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
