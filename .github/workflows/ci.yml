name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: procure
          POSTGRES_PASSWORD: procure
          POSTGRES_DB: procure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procure -d procure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://procure:procure@127.0.0.1:5432/procure?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check modules are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test (race, with PostgreSQL)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Ensure commands do not link test doubles
        run: |
          if go list -deps ./cmd/... | grep -q 'internal/testsupport'; then
            echo "cmd/ must not depend on internal/testsupport"
            exit 1
          fi

      - name: Build container image
        run: docker build -t procure-flow:ci .
